<!DOCTYPE html>
<html>

<head>

<title>Scorecard</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
padding:20px;
}

h1{
text-align:center;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

th,td{
border:1px solid #334155;
padding:8px;
text-align:center;
}

th{
background:#009270;
}

</style>

</head>

<body>

<h1 id="teams">Match Scorecard</h1>

<h2>Batting</h2>

<table>

<thead>

<tr>
<th>Batsman</th>
<th>Runs</th>
<th>Balls</th>
<th>4s</th>
<th>6s</th>
<th>SR</th>
</tr>

</thead>

<tbody id="batting"></tbody>

</table>

<h2>Bowling</h2>

<table>

<thead>

<tr>
<th>Bowler</th>
<th>Overs</th>
<th>Runs</th>
<th>Wickets</th>
<th>Economy</th>
</tr>

</thead>

<tbody id="bowling"></tbody>

</table>

<script src="scorecard.js"></script>
<button onclick="saveScorecard()">Save Scorecard</button>

</body>
</html>
