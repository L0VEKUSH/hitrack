<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>🏏 HiTrack Players</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
padding:30px;
}

h1{
text-align:center;
margin-bottom:30px;
}

table{
width:70%;
margin:auto;
border-collapse:collapse;
background:#1e293b;
}

th,td{
padding:15px;
border:1px solid #444;
text-align:center;
}

th{
background:#020617;
}

tr:nth-child(even){
background:#151d2b;
}

img{
width:60px;
height:60px;
border-radius:50%;
}

.player-link{
color:#60a5fa;
font-weight:bold;
text-decoration:none;
}

.player-link:hover{
text-decoration:underline;
}

</style>
</head>

<body>

<h1>🏏 HiTrack Players</h1>

<table>

<thead>
<tr>
<th>Photo</th>
<th>Name</th>
<th>Player Type</th>
</tr>
</thead>

<tbody id="players"></tbody>

</table>

<script>

async function loadPlayers(){

const res = await fetch("/api/players-info")
const players = await res.json()

const tbody=document.getElementById("players")

tbody.innerHTML=""

players.forEach(p=>{

tbody.innerHTML+=`

<tr>

<td>
<img src="${p.photo || 'https://via.placeholder.com/60'}">
</td>

<td>
<a class="player-link" href="player.html?id=${p._id}">
${p.name}
</a>
</td>

<td>${p.playerType || "Unknown"}</td>

</tr>

`

})

}

loadPlayers()

</script>

</body>
</html>
